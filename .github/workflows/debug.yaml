name: Debug

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Runs on'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - macos-26-intel
          - windows-latest

jobs:
  debug:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # - name: Install Nix (non-Windows only)
      #   if: runner.os != 'Windows'
      #   uses: cachix/install-nix-action@v27
      #   with:
      #     github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Configure Nix channel (non-Windows only)
      #   if: runner.os != 'Windows'
      #   run: |
      #     nix-channel --add https://nixos.org/channels/nixos-24.05
      #     nix-channel --update

      - name: Start Upterm session
        id: upterm
        uses: owenthereal/action-upterm@v2.8.1
        env:
          NIXPKGS_ALLOW_UNFREE: 1
        with:
          detached: true
          limit-access-to-actor: true
          allow-exec: true
          upterm-version: v0.41.1

      - name: Publish SSH connection
        shell: bash
        env:
          SSH_COMMAND: ${{ steps.upterm.outputs.ssh-command }}
        run: |
          test -n "$SSH_COMMAND"
          printf '::notice title=Upterm SSH::%s\n' "$SSH_COMMAND"
